# /etc/ssh/sshd_config.d/60-tunnel-fwd.conf
# Forward-only account for the cc-connect remote-access tunnel.
# Create the user first:
#   useradd -m -s /sbin/nologin fwd
#   install -d -m 700 -o fwd -g fwd /home/fwd/.ssh
#   install -m 600 -o fwd -g fwd /dev/null /home/fwd/.ssh/authorized_keys
# then append the machine's id_cc_tunnel.pub to authorized_keys.

Match User fwd
    # Remote (-R) forwarding only, loopback-only on this host.
    AllowTcpForwarding remote
    # Whitelist every forwarded (listen) port explicitly. Anything not
    # listed here is refused, which is what makes the account safe.
    # 18080 code-server | 18081 web terminal | 18082 cc-connect console
    # remaining entries are dev-server preview ports — trim/extend freely.
    PermitListen 127.0.0.2:18080-18082
    PermitListen 127.0.0.2:3000-3001
    PermitListen 127.0.0.2:4000
    PermitListen 127.0.0.2:4200
    PermitListen 127.0.0.2:5000
    PermitListen 127.0.0.2:5173-5174
    PermitListen 127.0.0.2:8000-8001
    PermitListen 127.0.0.2:8888
    PermitListen 127.0.0.2:9000
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
    ForceCommand /usr/bin/true
